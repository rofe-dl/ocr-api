[project]
name = "ocr-api"
version = "0.1.0"
description = "OCR API for Flexbone"
readme = "README.md"
authors = [
    { name = "Rafidul Islam", email = "rafidul258@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-multipart>=0.0.32",
]

[project.scripts]
ocr-api = "ocr_api:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.fastapi]
entrypoint = "ocr_api.main:app"
